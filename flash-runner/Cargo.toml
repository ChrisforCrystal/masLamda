[package]
name = "flash-runner"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tonic = "0.10"
prost = "0.12"
wasmtime = "14.0"
wasmtime-wasi = { version = "14.0", features = ["tokio", "sync"] }
wasi-common = "14.0"
reqwest = { version = "0.11", features = ["json"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.0", features = ["v4"] }
cap-std = "2.0"
os_pipe = "1.2.3"

[dev-dependencies]
wat = "1.0"

[build-dependencies]
tonic-build = "0.10"
