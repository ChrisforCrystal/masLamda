apiVersion: v1
kind: ConfigMap
metadata:
  name: hami-scheduler-config
  namespace: kube-system
data:
  config.yaml: |
    # Hami 核心配置：资源调度策略
    scheduler:
      defaultSchedulerPolicy:
        # 节点调度策略：Binpack (堆叠)。
        # 含义：尽量把前面的节点填满，再用下一个节点。避免资源碎片化。
        nodeSchedulerPolicy: binpack  
        # GPU调度策略：Binpack。
        # 含义：尽量把一张显卡填满，再用下一张显卡。
        gpuSchedulerPolicy: binpack
---
apiVersion: apps/v1
kind: DaemonSet # Hami Device Plugin，每台 GPU 节点跑一个
metadata:
  name: hami-device-plugin
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: hami-device-plugin
  template:
    metadata:
      labels:
        app: hami-device-plugin
    spec:
      containers:
        - name: device-plugin
          image: projecthami/hami:v2.4.0
          command: ["/usr/bin/hami-device-plugin"]
          args:
            - "-v"
            - "4" # 日志级别
            # 资源名称劫持：这是最关键的一行！
            # 它可以覆盖掉原生的 "nvidia.com/gpu"，让 K8s 以为 Hami 才是唯一的显卡提供者。
            # 也可以配置成 "hami.io/vgpu" 实现共存。
            - "-resource-name"
            - "nvidia.com/gpu"
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins # 同样需要注册给 Kubelet
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
